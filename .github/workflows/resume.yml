name: Resume LaTeX build

# Compiles the resume sources and reports page count + overfull boxes,
# so "ready-to-compile" and "fits one page" are verified rather than asserted.

on:
  push:
    paths:
      - "resume/**.tex"
      - ".github/workflows/resume.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install LaTeX (TeX Live)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            texlive-latex-base texlive-latex-recommended \
            texlive-latex-extra texlive-fonts-recommended \
            texlive-fonts-extra texlive-pictures texlive-science latexmk

      - name: Compile
        run: |
          set -u
          mkdir -p out
          rc=0
          for f in resume/*.tex; do
            base=$(basename "$f" .tex)
            echo "::group::Compiling $base"
            pdflatex -interaction=nonstopmode -output-directory=out "$f" > "out/$base.pass1.log" 2>&1
            pdflatex -interaction=nonstopmode -output-directory=out "$f" > "out/$base.log" 2>&1
            status=$?
            echo "--- first errors ---"
            grep -nE "^! |^l\.[0-9]+|Emergency stop|File .* not found" "out/$base.log" | head -12 || echo "none"
            echo "--- warnings ---"
            grep -E "Overfull|Underfull|LaTeX Warning" "out/$base.log" | head -20 || echo "none"
            if [ $status -ne 0 ]; then
              rc=1
              first=$(grep -m1 -E "^! " "out/$base.log" | cut -c1-180)
              line=$(grep -m1 -oE "^l\.[0-9]+" "out/$base.log")
              echo "::error file=resume/$base.tex::pdflatex failed - ${first:-unknown error} ${line}"
              echo "--- last 25 log lines ---"
              tail -25 "out/$base.log"
            fi
            echo "::endgroup::"
          done
          exit $rc

      - name: Publish build log for inspection
        if: always()
        run: |
          mkdir -p ci-logs
          for f in out/*.log; do
            [ -e "$f" ] || continue
            cp "$f" "ci-logs/$(basename "$f")"
          done
          git config user.name  "ci-log-bot"
          git config user.email "ci-log-bot@users.noreply.github.com"
          git checkout -B ci-logs
          git add -f ci-logs
          git commit -m "ci: resume build logs for ${GITHUB_SHA}" || echo "nothing to commit"
          git push -f origin ci-logs || echo "log push failed"

      - name: Page counts
        run: |
          python3 scripts/resume_pages.py out

      - name: Upload PDFs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: resume-build
          path: |
            out/*.pdf
            out/*.log
          if-no-files-found: warn
