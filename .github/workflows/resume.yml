name: Resume LaTeX build

# Compiles the resume sources and reports page count + overfull boxes,
# so "ready-to-compile" and "fits one page" are verified rather than asserted.

on:
  push:
    paths:
      - "resume/**.tex"
      - ".github/workflows/resume.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install LaTeX (TeX Live)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            texlive-latex-base texlive-latex-recommended \
            texlive-latex-extra texlive-fonts-recommended \
            texlive-pictures texlive-science latexmk

      - name: Compile
        run: |
          set -eu
          mkdir -p out
          for f in resume/*.tex; do
            base=$(basename "$f" .tex)
            echo "::group::Compiling $base"
            pdflatex -interaction=nonstopmode -halt-on-error -output-directory=out "$f" > "out/$base.pass1.log" 2>&1 || {
              echo "PDFLATEX FAILED for $base"; tail -40 "out/$base.pass1.log"; exit 1; }
            pdflatex -interaction=nonstopmode -halt-on-error -output-directory=out "$f" > "out/$base.log" 2>&1 || {
              echo "PDFLATEX FAILED (pass 2) for $base"; tail -40 "out/$base.log"; exit 1; }
            echo "--- warnings ---"
            grep -E "Overfull|Underfull|LaTeX Warning" "out/$base.log" | head -20 || echo "none"
            echo "::endgroup::"
          done

      - name: Page counts
        run: |
          python3 scripts/resume_pages.py out

      - name: Upload PDFs
        uses: actions/upload-artifact@v4
        with:
          name: resume-pdfs
          path: out/*.pdf
          if-no-files-found: error
